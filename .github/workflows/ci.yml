name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: install frontend dependencies
        run: npm ci
      - name: lint
        run: npm run lint
      - name: run tests
        run: npm test
      - name: build frontend
        run: npm run build
